name: Windows installer

# Builds the downloadable artefacts twice over:
#   * every manual run -> workflow artifact (internally testable)
#   * every v* tag     -> attached to the GitHub Release
#
# The smoke test performs a real per-user installation on the runner, starts the
# installed application in headless self-check mode, and uninstalls it again, so a
# broken wizard cannot be published.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and smoke-test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/windows/requirements.txt
          pip install -e .

      - name: Import the code-signing certificate
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) {
            Write-Host "signing: no WINDOWS_SIGN_PFX_BASE64 secret, artefacts stay unsigned"
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP "quarkon-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "QUARKON_SIGN_PFX=$path" >> $env:GITHUB_ENV
          "QUARKON_SIGN_PFX_PASSWORD=$env:SIGN_PFX_PASSWORD" >> $env:GITHUB_ENV
          Write-Host "signing: certificate imported from the repository secret"

      - name: Build installer and portable build
        run: python packaging/windows/build_windows.py

      - name: Smoke-test a silent installation
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/windows -Filter 'QuarkonSetup-*-win64.exe' | Select-Object -First 1).FullName
          if (-not $setup) { throw 'the installer was not built' }
          Write-Host "Smoke-testing $setup"
          pwsh -File packaging/windows/smoke_test.ps1 -SetupPath $setup

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: quarkon-windows
          path: |
            dist/windows/QuarkonSetup-*-win64.exe
            dist/windows/Quarkon-*-win64-portable.zip
            dist/windows/SHA256SUMS.txt
            packaging/windows/assets/Kdjkvv7886-codesign.cer
          if-no-files-found: error

      - name: Publish to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/QuarkonSetup-*-win64.exe
            dist/windows/Quarkon-*-win64-portable.zip
            dist/windows/SHA256SUMS.txt
            packaging/windows/assets/Kdjkvv7886-codesign.cer
