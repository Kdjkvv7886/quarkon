name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check opendistill tests
      - name: Type check
        run: mypy opendistill
      - name: Test
        run: pytest -q
      - name: Build wheel
        run: pip wheel . --no-deps -w dist
      - name: Install and smoke-test the wheel
        run: |
          python -m venv /tmp/od-venv
          /tmp/od-venv/bin/pip install --quiet dist/*.whl
          /tmp/od-venv/bin/opendistill --version
          /tmp/od-venv/bin/opendistill --format json init /tmp/od-project > /tmp/init.json
          python -c "import json;d=json.load(open('/tmp/init.json'));assert d['ok'] is True"
          /tmp/od-venv/bin/opendistill --config /tmp/od-project/distill.yaml validate

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit build twine
          pip install -e ".[dev]"
      - name: Static analysis (fail on medium or higher)
        run: bandit -r opendistill -ll -q
      - name: Dependency audit (declared runtime dependencies)
        run: |
          python - <<'PY'
          import pathlib, tomllib
          deps = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["dependencies"]
          pathlib.Path("/tmp/req.txt").write_text("\n".join(deps))
          PY
          pip-audit -r /tmp/req.txt --progress-spinner off
      - name: Artefact metadata check
        run: |
          python -m build --wheel --sdist --outdir dist
          twine check dist/*
