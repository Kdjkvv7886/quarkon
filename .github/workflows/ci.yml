name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check opendistill tests
      - name: Type check
        run: mypy opendistill
      - name: Test
        run: pytest -q
      - name: Build wheel
        run: pip wheel . --no-deps -w dist
      - name: Install and smoke-test the wheel
        run: |
          python -m venv /tmp/od-venv
          /tmp/od-venv/bin/pip install --quiet dist/*.whl
          /tmp/od-venv/bin/opendistill --version
          /tmp/od-venv/bin/opendistill --format json init /tmp/od-project > /tmp/init.json
          python -c "import json;d=json.load(open('/tmp/init.json'));assert d['ok'] is True"
          /tmp/od-venv/bin/opendistill --config /tmp/od-project/distill.yaml validate
